<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Lançamento de Votos</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 min-h-screen font-sans">

  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold uppercase">Painel Mesário (Geral)</h1>
      <div class="flex gap-2 items-center">
        <button onclick="definirStatusApuracao('iniciada')" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg font-bold transition">Iniciar apuração</button>
        <button onclick="definirStatusApuracao('concluida')" class="text-xs bg-yellow-500 hover:bg-yellow-600 text-slate-900 px-3 py-2 rounded-lg font-bold transition">Finalizar apuração</button>
        <button onclick="zerarUrna()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg font-bold transition">Zerar Urna ⚠️</button>
        <a href="conselho.html" class="text-xs bg-amber-600 hover:bg-amber-700 text-white px-3 py-2 rounded-lg font-bold">Painel Conselho ↗</a>
        <a href="index.html" target="_blank" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-bold">Ver Tela Pública ↗</a>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-6 mt-4">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-100 text-slate-600 text-sm uppercase tracking-wider border-b">
            <th class="p-4">Cargo</th>
            <th class="p-4">Candidato</th>
            <th class="p-4 text-center">Votos no Banco</th>
            <th class="p-4 text-center">Adicionar Votos (Qtd / Ação)</th>
          </tr>
        </thead>
        <tbody id="tabela-admin" class="divide-y divide-slate-200">
          <tr><td colspan="4" class="p-6 text-center text-slate-500">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="candidates.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxAtnjb2uU3JPRwcVh_YaR5VzXZzFWyQDMr-xRA2ll1I6bRkBVMpUSHAgLNsfFYICZFVw/exec";
    const CHAVE_STATUS_APURACAO = 'eleicao-neb-status-apuracao';

    function definirStatusApuracao(status) {
      localStorage.setItem(CHAVE_STATUS_APURACAO, status);
    }

    function escaparHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[caractere]);
    }

    let carregandoAdmin = false;

    async function carregarAdmin() {
      if (carregandoAdmin) return;
      carregandoAdmin = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(`${API_URL}?acao=ler`, { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (data.status === "sucesso" && Array.isArray(data.candidatos)) {
          const tbody = document.getElementById('tabela-admin');
          tbody.innerHTML = '';

          const filtrados = candidatosOficiais(data.candidatos);

          filtrados.forEach((c, index) => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50';
            const cadastrado = c.cadastradoNaUrna;
            const chaveLinha = c.id ?? `ausente-${index}`;
            tr.innerHTML = `
              <td class="p-4 font-semibold text-slate-700">${escaparHtml(c.cargo)}</td>
              <td class="p-4 font-bold text-slate-900">${escaparHtml(c.nome)}</td>
              <td class="p-4 text-center"><span class="text-2xl font-black text-blue-600" id="votos-${escaparHtml(chaveLinha)}">${escaparHtml(c.votos)}</span></td>
              <td class="p-4 text-center">
                <div class="flex justify-center items-center gap-2">
                  <input type="number" id="input-${escaparHtml(chaveLinha)}" min="1" value="1" ${cadastrado ? '' : 'disabled'} class="border border-slate-300 rounded-lg px-3 py-2 w-20 text-center font-bold text-lg disabled:bg-slate-100">
                  <button id="btn-${escaparHtml(chaveLinha)}" data-votar ${cadastrado ? '' : 'disabled title="Candidato sem cadastro na urna"'} class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-400 text-white font-bold py-2 px-5 rounded-lg shadow transition-all transform active:scale-95 text-sm">
                    ${cadastrado ? '+ Inserir' : 'Sem cadastro'}
                  </button>
                </div>
              </td>
            `;
            if (cadastrado) tr.querySelector('[data-votar]').addEventListener('click', () => votar(c.id));
            tbody.appendChild(tr);
          });
        } else {
          throw new Error(data.message || 'A API respondeu sem uma lista válida de candidatos.');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('tabela-admin').innerHTML = `
          <tr><td colspan="4" class="p-6 text-center text-red-700">
            Não foi possível carregar os candidatos. A tela tentará novamente automaticamente.<br>
            <span class="text-sm">${escaparHtml(e.name === 'AbortError' ? 'A API demorou mais de 12 segundos para responder.' : e.message)}</span>
          </td></tr>`;
      } finally {
        clearTimeout(timeoutId);
        carregandoAdmin = false;
      }
    }

    async function votar(id) {
      const inputEl = document.getElementById(`input-${id}`);
      const btnEl = document.getElementById(`btn-${id}`);
      const qtd = Number(inputEl.value);

      if (!Number.isSafeInteger(qtd) || qtd <= 0) {
        alert("Insira uma quantidade válida de votos.");
        return;
      }

      // Feedback visual rápido de carregamento no botão
      const textoOriginal = btnEl.innerText;
      btnEl.innerText = "...";
      btnEl.disabled = true;

      try {
        const response = await fetch(`${API_URL}?acao=votar&id=${encodeURIComponent(id)}&qtd=${qtd}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        if (data.status === "sucesso") {
          inputEl.value = 1; 
          await carregarAdmin(); // Atualiza instantaneamente após o sucesso
        } else {
          alert("Erro ao registrar voto.");
          btnEl.innerText = textoOriginal;
          btnEl.disabled = false;
        }
      } catch (e) {
        alert("Erro de conexão.");
        btnEl.innerText = textoOriginal;
        btnEl.disabled = false;
      }
    }

    async function zerarUrna() {
      if (!confirm("⚠️ ATENÇÃO: Deseja realmente ZERAR todos os votos desta urna? Esta ação não poderá ser desfeita!")) return;

      try {
        const response = await fetch(`${API_URL}?acao=zerar`);
        const data = await response.json();

        if (data.status === "sucesso") {
          alert("Urna zerada com sucesso!");
          carregarAdmin();
        } else {
          alert("Erro ao zerar urna.");
        }
      } catch (e) {
        alert("Erro de conexão com o Apps Script.");
      }
    }

    carregarAdmin();
    setInterval(carregarAdmin, 5000); // Atualiza a cada 5 segundos sem sobrepor consultas pendentes
  </script>
</body>
</html>
