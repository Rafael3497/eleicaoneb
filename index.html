<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuração Geral - Eleição NEB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
  
  <header class="bg-blue-900 text-white p-6 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold uppercase tracking-wide">Eleição NEB - Apuração ao Vivo</h1>
      <div class="flex items-center gap-4">
    
        <span class="flex items-center gap-2 text-sm bg-blue-800 px-3 py-1 rounded-full">
          <span class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
          </span>
          AO VIVO
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 mt-6" id="dashboard">
    <div class="text-center text-slate-500 mt-20 text-lg">Carregando painel de apuração...</div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxAtnjb2uU3JPRwcVh_YaR5VzXZzFWyQDMr-xRA2ll1I6bRkBVMpUSHAgLNsfFYICZFVw/exec";

    async function carregarDados() {
      try {
        const response = await fetch(`${API_URL}?acao=ler`);
        const data = await response.json();
        
        if (data.status === "sucesso") {
          renderizarDashboard(data.candidatos);
        }
      } catch (error) {
        console.error("Erro ao buscar dados:", error);
      }
    }

    function renderizarDashboard(candidatos) {
      const dashboard = document.getElementById('dashboard');
      
      const porCargo = candidatos.reduce((acc, c) => {
        if (!acc[c.cargo]) acc[c.cargo] = [];
        acc[c.cargo].push(c);
        return acc;
      }, {});

      dashboard.innerHTML = '';

      for (const [cargo, lista] of Object.entries(porCargo)) {
        lista.sort((a, b) => b.votos - a.votos);

        const secao = document.createElement('div');
        secao.className = 'mb-10';
        
        let html = `
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-blue-900 pb-2 mb-6 uppercase">${cargo}</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        `;

        lista.forEach((c, index) => {
          let statusBadge = '';
          let bgCard = 'bg-white shadow-sm';
          const cargoLower = cargo.toLowerCase();

          if (cargoLower.includes('presidente')) {
            if (index === 0 && c.votos > 0) { statusBadge = '<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">PRESIDENTE</span>'; bgCard = 'bg-blue-50 border-2 border-blue-500 shadow-md'; }
            else if (index === 1 && c.votos > 0) { statusBadge = '<span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded font-bold">VICE-PRESIDENTE</span>'; bgCard = 'bg-emerald-50 border-2 border-emerald-400 shadow-md'; }
          } else if (cargoLower.includes('tesoureiro') || cargoLower.includes('secretário')) {
            if (index === 0 && c.votos > 0) { statusBadge = `<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">1º ${cargo}</span>`; bgCard = 'bg-blue-50 border-2 border-blue-500 shadow-md'; }
            else if (index === 1 && c.votos > 0) { statusBadge = `<span class="bg-emerald-600 text-white text-xs px-2 py-1 rounded font-bold">2º ${cargo}</span>`; bgCard = 'bg-emerald-50 border-2 border-emerald-400 shadow-md'; }
          } else if (cargoLower.includes('conselho fiscal')) {
            if (index === 0 && c.votos > 0) { statusBadge = '<span class="bg-amber-600 text-white text-xs px-2 py-1 rounded font-bold">Presidente Conselho</span>'; bgCard = 'bg-amber-50 border-2 border-amber-500 shadow-md'; }
            else if (index === 1 && c.votos > 0) { statusBadge = '<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">1º Membro</span>'; bgCard = 'bg-blue-50 border-2 border-blue-400 shadow-md'; }
            else if (index === 2 && c.votos > 0) { statusBadge = '<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">2º Membro</span>'; bgCard = 'bg-blue-50 border-2 border-blue-400 shadow-md'; }
            else if (index >= 3 && index <= 5 && c.votos > 0) { statusBadge = `<span class="bg-slate-600 text-white text-xs px-2 py-1 rounded font-bold">${index - 2}º Suplente</span>`; bgCard = 'bg-slate-50 border border-slate-300 shadow-sm'; }
          } else {
            if (index === 0 && c.votos > 0) { bgCard = 'bg-amber-50 border-2 border-amber-400 shadow-md'; }
          }

          // Tratamento robusto do caminho da foto (com barra inicial / para garantir leitura no Netlify)
          let fotoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(c.nome)}&background=0D8ABC&color=fff&size=128`;
          if (c.foto && c.foto.trim() !== "") {
            // Se o usuário digitou "assets/thiago.jpeg", transforma em "/assets/thiago.jpeg" para garantir a rota no servidor
            fotoUrl = c.foto.startsWith('http') ? c.foto : (c.foto.startsWith('/') ? c.foto : '/' + c.foto);
          }
          
          html += `
            <div class="${bgCard} p-6 rounded-xl flex flex-col items-center text-center justify-between transition-all">
              <div class="w-full flex justify-between items-center mb-3">
                <span class="text-xs font-bold text-slate-400 uppercase">Ranking #${index + 1}</span>
                ${statusBadge}
              </div>
              <img src="${fotoUrl}" alt="${c.nome}" class="w-20 h-20 rounded-full object-cover shadow-md border-2 border-slate-200 mb-3" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(c.nome)}&background=0D8ABC&color=fff&size=128';">
              <h3 class="text-xl font-bold text-slate-800">${c.nome}</h3>
              <p class="text-sm text-slate-500 mb-4">Nº ${c.numero || '-'}</p>
              
              <div class="w-full flex justify-between items-center mt-2 pt-4 border-t border-slate-100">
                <span class="text-xs font-semibold text-slate-500 uppercase">Votos</span>
                <span class="text-3xl font-black text-blue-900">${c.votos}</span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        secao.innerHTML = html;
        dashboard.appendChild(secao);
      }
    }

    // Rolagem Automática Suave (A cada 5 segundos)
    let descendo = true;

    function iniciarAutoScroll() {
      setInterval(() => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const currentScroll = window.scrollY;

        if (descendo) {
          if (currentScroll >= maxScroll - 10) {
            descendo = false;
          } else {
            window.scrollBy({ top: window.innerHeight * 0.5, behavior: 'smooth' });
          }
        } else {
          if (currentScroll <= 10) {
            descendo = true;
          } else {
            window.scrollBy({ top: -window.innerHeight * 0.5, behavior: 'smooth' });
          }
        }
      }, 5000);
    }

    carregarDados();
    setInterval(carregarDados, 1500);

    window.onload = () => {
      setTimeout(iniciarAutoScroll, 2500);
    };
  </script>
</body>
</html>
