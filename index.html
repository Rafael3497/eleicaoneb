<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apuração Geral - Eleição NEB 2027/2030</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
  
  <header class="bg-blue-900 text-white p-6 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex flex-col items-start gap-3 sm:flex-row sm:justify-between sm:items-center">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold uppercase tracking-wide leading-tight">Eleição NEB - Apuração ao Vivo</h1>
        <p class="mt-1 text-sm font-medium text-blue-100">Diretoria e Conselho Fiscal para o triênio 2027/2030</p>
      </div>
      <div class="flex items-center gap-4">
    
        <span id="status-apuracao-badge" class="flex shrink-0 items-center gap-2 whitespace-nowrap text-sm bg-blue-800 px-3 py-1 rounded-full">
          <span id="status-apuracao-dot" class="inline-flex shrink-0 rounded-full h-3 w-3 bg-emerald-500"></span>
          <span id="status-apuracao-text" class="whitespace-nowrap">AO VIVO</span>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 mt-6" id="dashboard">
    <div class="text-center text-slate-500 mt-20 text-lg">Aguarde, carregando a apuração...</div>
  </main>

  <script src="candidates.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxAtnjb2uU3JPRwcVh_YaR5VzXZzFWyQDMr-xRA2ll1I6bRkBVMpUSHAgLNsfFYICZFVw/exec";
    let statusApuracao = 'ao-vivo';
    let carregandoDados = false;

    function atualizarIndicadorApuracao() {
      const textos = {
        'ao-vivo': '',
        iniciada: 'Apuração Iniciada',
        concluida: 'Apuração Concluída'
      };
      const badge = document.getElementById('status-apuracao-badge');
      const dot = document.getElementById('status-apuracao-dot');
      document.getElementById('status-apuracao-text').textContent = textos[statusApuracao] || textos['ao-vivo'];
      badge.classList.toggle('hidden', statusApuracao === 'ao-vivo');
      badge.classList.toggle('bg-yellow-300', statusApuracao === 'concluida');
      badge.classList.toggle('text-slate-900', statusApuracao === 'concluida');
      badge.classList.toggle('bg-blue-800', statusApuracao === 'ao-vivo');
      badge.classList.toggle('bg-emerald-700', statusApuracao === 'iniciada');
      dot.classList.toggle('bg-yellow-600', statusApuracao === 'concluida');
      dot.classList.toggle('bg-emerald-500', statusApuracao !== 'concluida');
    }

    function escaparHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[caractere]);
    }

    async function carregarDados() {
      if (carregandoDados) return;
      carregandoDados = true;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const response = await fetch(`${API_URL}?acao=ler`, { cache: 'no-store', signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        if (data.status === "sucesso" && Array.isArray(data.candidatos)) {
          statusApuracao = ['iniciada', 'concluida'].includes(data.statusApuracao) ? data.statusApuracao : 'ao-vivo';
          atualizarIndicadorApuracao();
          renderizarDashboard(data.candidatos);
        } else {
          mostrarEstado("A API respondeu, mas não trouxe uma lista válida de candidatos.");
        }
      } catch (error) {
        console.error("Erro ao buscar dados:", error);
        mostrarEstado(error.name === 'AbortError'
          ? 'Aguarde: a API está demorando para responder. Tentaremos novamente em instantes.'
          : 'Não foi possível carregar a apuração. Verifique a conexão com a API.');
      } finally {
        clearTimeout(timeoutId);
        carregandoDados = false;
      }
    }

    function mostrarEstado(mensagem) {
      const dashboard = document.getElementById('dashboard');
      dashboard.innerHTML = `<div class="rounded-xl bg-white p-8 text-center text-slate-600 shadow-sm">${escaparHtml(mensagem)}</div>`;
    }

    function renderizarDashboard(candidatos) {
      const dashboard = document.getElementById('dashboard');
      candidatos = candidatosOficiais(candidatos);

      if (!candidatos.length) {
        mostrarEstado("A API não retornou nomes compatíveis com a lista oficial de candidatos.");
        return;
      }
      
      const porCargo = candidatos.reduce((acc, c) => {
        if (!acc[c.cargo]) acc[c.cargo] = [];
        acc[c.cargo].push(c);
        return acc;
      }, {});

      dashboard.innerHTML = '';

      const ordemCargos = [
        'Presidente',
        'Vice presidente',
        '1º secretário',
        '2º secretário',
        '1º tesoureiro',
        '2º tesoureiro',
        'Orador oficial',
        'Conselho fiscal'
      ];
      const cargosOrdenados = [
        ...ordemCargos.filter((cargo) => porCargo[cargo]).map((cargo) => [cargo, porCargo[cargo]]),
        ...Object.entries(porCargo).filter(([cargo]) => !ordemCargos.includes(cargo))
      ];

      for (const [cargo, lista] of cargosOrdenados) {
        lista.sort((a, b) => Number(b.votos) - Number(a.votos) || a.nome.localeCompare(b.nome, 'pt-BR'));
        const maiorVotacao = Math.max(...lista.map((c) => Number(c.votos) || 0));

        const secao = document.createElement('div');
        secao.className = 'mb-10';
        
        let html = `
          <h2 class="text-2xl font-bold text-slate-800 border-b-2 border-blue-900 pb-2 mb-6 uppercase">${escaparHtml(cargo)}</h2>
          <div class="grid grid-cols-1 gap-6">
        `;

        lista.forEach((c, index) => {
          let statusBadge = '';
          let bgCard = 'bg-white shadow-sm';
          const cargoLower = cargo.toLowerCase();

          if (cargoLower === 'conselho fiscal') {
            if (index === 0 && c.votos > 0) { statusBadge = '<span class="bg-amber-600 text-white text-xs px-2 py-1 rounded font-bold">Presidente</span>'; bgCard = 'bg-amber-50 border-2 border-amber-500 shadow-md'; }
            else if (index === 1 && c.votos > 0) { statusBadge = '<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">1º Membro</span>'; bgCard = 'bg-blue-50 border-2 border-blue-400 shadow-md'; }
            else if (index === 2 && c.votos > 0) { statusBadge = '<span class="bg-blue-600 text-white text-xs px-2 py-1 rounded font-bold">2º Membro</span>'; bgCard = 'bg-blue-50 border-2 border-blue-400 shadow-md'; }
            else if (index >= 3 && index <= 6 && c.votos > 0) { statusBadge = `<span class="bg-slate-600 text-white text-xs px-2 py-1 rounded font-bold">${index - 2}º Suplente</span>`; bgCard = 'bg-slate-50 border border-slate-300 shadow-sm'; }
          } else {
            if (index === 0 && c.votos > 0) { bgCard = 'bg-amber-50 border-2 border-amber-400 shadow-md'; }
          }

          const nome = String(c.nome ?? 'Candidato');
          const eleito = statusApuracao === 'concluida'
            && (cargoLower === 'conselho fiscal'
              ? index < 6
              : maiorVotacao > 0 && Number(c.votos) === maiorVotacao);
          let fotoUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=0D8ABC&color=fff&size=128`;
          if (c.foto && c.foto.trim() !== "") {
            // Caminhos relativos funcionam em hospedagens na raiz ou em subdiretórios.
            fotoUrl = c.foto.startsWith('http') ? c.foto : c.foto.replace(/^\/+/, '');
          }
          
          html += `
            <div class="${bgCard} p-6 rounded-xl flex flex-col items-center text-center justify-between transition-all">
              <div class="w-full flex justify-between items-center mb-3">
                ${statusBadge}
              </div>
              <img src="${escaparHtml(fotoUrl)}" alt="${escaparHtml(nome)}" class="w-20 h-20 rounded-full object-cover shadow-md border-2 border-slate-200 mb-3">
              <h3 class="mb-4 text-xl font-bold text-slate-800">${escaparHtml(nome)}${eleito ? ' <span class="ml-2 rounded-full bg-emerald-600 px-2 py-1 text-xs text-white">Eleito</span>' : ''}</h3>

              <div class="w-full flex justify-between items-center mt-2 pt-4 border-t border-slate-100">
                <span class="text-xs font-semibold text-slate-500 uppercase">Votos</span>
                <span class="text-3xl font-black text-blue-900">${escaparHtml(c.votos)}</span>
              </div>
            </div>
          `;
        });

        html += `</div>`;
        secao.innerHTML = html;
        secao.querySelectorAll('img').forEach((img) => {
          img.addEventListener('error', () => {
            img.onerror = null;
            img.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(img.alt)}&background=0D8ABC&color=fff&size=128`;
          }, { once: true });
        });
        dashboard.appendChild(secao);
      }
    }

    // Rolagem Automática Suave (A cada 5 segundos)
    let descendo = true;

    function iniciarAutoScroll() {
      setInterval(() => {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        const currentScroll = window.scrollY;

        if (descendo) {
          if (currentScroll >= maxScroll - 10) {
            descendo = false;
          } else {
            window.scrollBy({ top: window.innerHeight * 0.5, behavior: 'smooth' });
          }
        } else {
          if (currentScroll <= 10) {
            descendo = true;
          } else {
            window.scrollBy({ top: -window.innerHeight * 0.5, behavior: 'smooth' });
          }
        }
      }, 5000);
    }

    atualizarIndicadorApuracao();
    carregarDados();
    setInterval(carregarDados, 5000);

    window.onload = () => {
      setTimeout(iniciarAutoScroll, 2500);
    };
  </script>
</body>
</html>
